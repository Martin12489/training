<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Ernährung"/>
<meta name="theme-color" content="#0A0A08"/>
<title>Ernährungs-Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A08;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#F0EDE8}
:root{
  --bg:#0A0A08;--s1:#131311;--s2:#1A1A17;--s3:#222220;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F0EDE8;--text2:#8A8880;--text3:#4A4845;
  --green:#1BF07E;--gbg:rgba(27,240,126,0.09);
  --amber:#F0A030;--abg:rgba(240,160,48,0.09);
  --blue:#4A9EF0;--bbg:rgba(74,158,240,0.09);
  --purple:#9B8FFF;--pbg:rgba(155,143,255,0.09);
  --red:#FF5A5A;--rbg:rgba(255,90,90,0.09);
  --teal:#00C4B4;
  --radius:16px;--rsm:12px;--rxs:8px;
}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,20px) 20px 0;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}
.app-name{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.date-pill{font-size:12px;font-weight:600;color:var(--text2);background:var(--s2);padding:5px 12px;border-radius:20px;border:1px solid var(--border2)}
.scroll{flex:1;overflow-y:auto;padding:20px 20px 100px}
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--s1);border-top:1px solid var(--border);display:flex;padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:100}
.navi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;padding:2px 4px}
.navi .ni{font-size:18px;color:var(--text3)}.navi .nl{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.04em}
.navi.active .ni,.navi.active .nl{color:var(--green)}
.view{display:none}.view.show{display:block}
.lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:0 0 10px}
/* CARDS */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-sm{background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:12px;margin-bottom:8px}
/* MACRO RINGS */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.ring-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px}
.rw{position:relative;width:52px;height:52px;flex-shrink:0}
.rw svg{transform:rotate(-90deg)}
.rn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:800;color:var(--text)}
.ri{flex:1;min-width:0}
.ri-l{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.ri-v{font-size:17px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ri-t{font-size:10px;color:var(--text3);margin-top:2px}
/* KCAL HERO */
.hero{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.hero-rw{position:relative;width:80px;height:80px;flex-shrink:0}
.hero-rw svg{transform:rotate(-90deg)}
.hero-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.1}
.hero-num{font-size:18px;font-weight:800;letter-spacing:-1px}
.hero-unit{font-size:9px;color:var(--text3);font-weight:600}
.hero-det{flex:1}
.hero-title{font-size:13px;font-weight:700;margin-bottom:6px}
.hero-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.hero-l{color:var(--text2)}.hero-r{font-weight:600}
/* MEALS */
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.meal-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.meal-kcal-sum{font-size:11px;font-weight:600;color:var(--amber)}
.meal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-name{font-size:13px;font-weight:600;margin-bottom:2px}
.meal-macro{font-size:11px;color:var(--text3)}
.meal-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px;margin-left:6px}
/* ADD */
.add-tabs{display:flex;gap:5px;margin-bottom:12px}
.add-tab{flex:1;padding:8px;border-radius:var(--rxs);border:1px solid var(--border2);background:transparent;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;text-align:center}
.add-tab.on{background:var(--green);border-color:var(--green);color:#000}
.ai-row{display:flex;gap:8px;align-items:flex-end}
.ai-ta{flex:1;min-height:44px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:14px;padding:10px 12px;resize:none;font-family:-apple-system,sans-serif;line-height:1.4}
.ai-btn{width:44px;height:44px;border-radius:var(--rxs);background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#000}
.ai-btn.spin{background:var(--s3);cursor:default;color:var(--text3)}
.ai-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
/* AI RESULT */
.ai-res{background:var(--s2);border:1px solid rgba(27,240,126,0.2);border-radius:var(--rsm);padding:12px;margin-top:10px}
.ai-res-tag{font-size:11px;font-weight:700;color:var(--green);margin-bottom:8px}
.am-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.am-box{background:var(--bg);border-radius:var(--rxs);padding:6px;text-align:center}
.am-v{font-size:15px;font-weight:700;letter-spacing:-.3px}
.am-l{font-size:8px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-top:1px}
.micro-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.mtag{font-size:10px;background:var(--s3);color:var(--text2);padding:2px 7px;border-radius:5px}
.meal-sel{width:100%;height:36px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s2);color:var(--text);font-size:12px;padding:0 10px;margin-bottom:8px}
.add-btn{width:100%;padding:11px;border-radius:var(--rxs);background:var(--green);border:none;color:#000;font-size:13px;font-weight:700;cursor:pointer}
/* MANUAL FORM */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ff{display:flex;flex-direction:column;gap:4px}
.fl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.fi{height:38px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:14px;font-weight:600;padding:0 10px;text-align:center;width:100%}
/* MIKRO BARS */
.micro-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.micro-row:last-child{border-bottom:none}
.micro-name{font-size:13px;color:var(--text2);flex:0 0 90px}
.micro-bar{flex:1;margin:0 10px;height:4px;background:var(--s3);border-radius:2px}
.micro-fill{height:4px;border-radius:2px}
.micro-val{font-size:11px;font-weight:600;min-width:70px;text-align:right}
/* WEEK CHART */
.week-bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin-bottom:8px}
.wbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wbar{width:100%;border-radius:4px 4px 0 0;min-height:3px;background:var(--s3)}
/* MONTH CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.cal-hd{font-size:8px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0;letter-spacing:.04em}
.cal-d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative}
/* PROFIL */
.pf-sec{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.pf-field{margin-bottom:12px}
.pf-field:last-child{margin-bottom:0}
.pf-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.pf-input{width:100%;height:44px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--s2);color:var(--text);font-size:17px;font-weight:600;padding:0 14px}
.gbtn{padding:12px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
.gbtn.on{background:var(--green);border-color:var(--green);color:#000}
.abtn{padding:10px 12px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:5px}
.abtn .as{font-size:10px;color:var(--text3);font-weight:400}
.abtn.on{border-color:var(--green);color:var(--text)}
.abtn.on .as{color:var(--green)}
.save-btn{width:100%;padding:14px;border-radius:var(--rsm);background:var(--green);border:none;color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.bmi-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.bmi-val{font-size:40px;font-weight:800;letter-spacing:-2px;margin-bottom:3px}
.bmi-cat{font-size:12px;font-weight:600;margin-bottom:10px}
.bmi-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.bmi-row:last-child{border-bottom:none}
.api-box{background:var(--s1);border:1px solid rgba(240,160,48,0.3);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.api-inp{width:100%;height:40px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s2);color:var(--text);font-size:13px;padding:0 12px;font-family:monospace;margin-bottom:8px}
.api-save{width:100%;padding:10px;border-radius:var(--rxs);background:var(--amber);border:none;color:#000;font-size:13px;font-weight:700;cursor:pointer}
/* WEIGHT ROW */
.w-row{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px;margin-bottom:12px}
.w-inp{width:70px;height:34px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:15px;font-weight:700;padding:0 8px;text-align:center}
.w-btn{padding:6px 14px;border-radius:var(--rxs);background:var(--green);border:none;color:#000;font-size:12px;font-weight:700;cursor:pointer}
/* AKTIVITÄT */
.pal-hero{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.pal-big{font-size:48px;font-weight:800;letter-spacing:-3px;line-height:1;margin-bottom:2px}
.pal-sub{font-size:12px;color:var(--text2);margin-bottom:12px}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal-box{background:var(--s2);border-radius:var(--rsm);padding:10px;text-align:center}
.pal-num{font-size:18px;font-weight:800;letter-spacing:-.5px}
.pal-lbl{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-top:2px}
.pal-breakdown{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.pb-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:8px}
.pb-row:last-child{border-bottom:none}
.pb-label{font-size:13px;color:var(--text2);flex:1}
.pb-formula{font-size:11px;color:var(--text3);min-width:90px;text-align:right}
.pb-val{font-size:13px;font-weight:700;min-width:36px;text-align:right}
/* SLIDERS */
.slider-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.slider-item{margin-bottom:14px}
.slider-item:last-child{margin-bottom:0}
.slider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.slider-label{font-size:13px;font-weight:600;color:var(--text)}
.slider-hint{font-size:10px;color:var(--text3)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;accent-color:var(--green);height:4px}
.slider-val{font-size:17px;font-weight:800;min-width:65px;text-align:right;line-height:1}
.slider-num-inp{width:70px;height:36px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:16px;font-weight:800;text-align:right;padding:0 8px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.slider-unit{font-size:11px;color:var(--text3)}
.hours-check{font-size:11px;text-align:center;padding:8px;border-top:1px solid var(--border);margin-top:8px}
/* AI ACT */
.act-ai-box{background:var(--s1);border:1px solid rgba(27,240,126,0.2);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.act-ai-title{font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px}
.act-ai-sub{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6}
.mic-btn{width:100%;padding:13px;border-radius:var(--rsm);border:1px solid rgba(27,240,126,0.3);background:var(--gbg);color:var(--green);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.mic-btn.recording{background:var(--rbg);border-color:rgba(255,90,90,0.4);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#fileInput{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-name">Ernährungs-Tracker</div>
      <div class="date-pill" id="datePill"></div>
    </div>
  </div>
  <div class="scroll">
    <div id="vHeute" class="view show"></div>
    <div id="vWoche" class="view"></div>
    <div id="vMonat" class="view"></div>
    <div id="vAktivitaet" class="view"></div>
    <div id="vProfil" class="view"></div>
  </div>
  <nav class="nav-bar">
    <button class="navi active" id="nHeute" onclick="setView('Heute')"><div class="ni">🏠</div><div class="nl">Heute</div></button>
    <button class="navi" id="nWoche" onclick="setView('Woche')"><div class="ni">📊</div><div class="nl">Woche</div></button>
    <button class="navi" id="nMonat" onclick="setView('Monat')"><div class="ni">📅</div><div class="nl">Monat</div></button>
    <button class="navi" id="nAktivitaet" onclick="setView('Aktivitaet')"><div class="ni">⚡</div><div class="nl">Aktivität</div></button>
    <button class="navi" id="nProfil" onclick="setView('Profil')"><div class="ni">👤</div><div class="nl">Profil</div></button>
  </nav>
  <input type="file" id="fileInput" accept="image/*" onchange="handleScan(event)"/>
</div>
<script>
// ── STORAGE ──────────────────────────────────────────────────────
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch(e){return d;}};

// ── DATES ─────────────────────────────────────────────────────────
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function getWeekDays(){
  const days=[];const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();const mon=new Date(today);
  mon.setDate(today.getDate()-(dow===0?6:dow-1));
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
  return days;
}
function dayName(d){return['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];}

// ── DATA KEYS ─────────────────────────────────────────────────────
const EK=(ds)=>'nutr_e_'+ds;
const WK=(ds)=>'nutr_w_'+ds;
const WAISTK=(ds)=>'nutr_waist_'+ds;
const AK=(ds)=>'nutr_a_'+ds;

function getEntries(ds){return ld(EK(ds),[]);}
function saveEntries(ds,arr){sv(EK(ds),arr);}
function getActivity(ds){return ld(AK(ds),{sleep:7,sitting:8,standing:0,training:0,cardio:0,steps:0});}
function saveActivity(ds,a){sv(AK(ds),a);}
function getProfile(){return ld('nutr_p',{gender:'M',age:30,height:180,weight:80,targetWeight:75,activity:1.4,goal:'fat'});}
function saveProfile(p){sv('nutr_p',p);}
function getApiKey(){return ld('nutr_key','');}
function saveApiKey(k){sv('nutr_key',k);}

function getDayTotals(ds){
  const entries=getEntries(ds);
  const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0,sodium:0,calcium:0,iron:0,vitC:0,vitD:0,magnesium:0,omega3:0};
  entries.forEach(function(e){Object.keys(t).forEach(function(k){t[k]+=(e[k]||0);});});
  return t;
}

// ── CALCULATIONS ─────────────────────────────────────────────────
function calcBMI(w,h){return Math.round(w/Math.pow(h/100,2)*10)/10;}
function bmiCat(bmi){
  if(bmi<18.5)return{cat:'Untergewicht',color:'var(--blue)'};
  if(bmi<25)return{cat:'Normalgewicht',color:'var(--green)'};
  if(bmi<30)return{cat:'Übergewicht',color:'var(--amber)'};
  return{cat:'Adipositas',color:'var(--red)'};
}

function calcBMR(p){
  if(!p.weight||!p.height||!p.age)return 0;
  if(p.gender==='M')return 88.362+(13.397*p.weight)+(4.799*p.height)-(5.677*p.age);
  return 447.593+(9.247*p.weight)+(3.098*p.height)-(4.330*p.age);
}

function calcPAL(ds){
  const act=getActivity(ds);
  const sleepH=Math.min(act.sleep||7,16);
  const sitH=Math.min(act.sitting||8,20);
  const standH=Math.min(act.standing||0,12);
  const trainH=(act.training||0)/60;
  const cardioH=(act.cardio||0)/60;
  const stepsH=Math.min((act.steps||0)/6000,4);
  const restH=Math.max(24-sleepH-sitH-standH-trainH-cardioH-stepsH,0);
  const sum=sleepH*0.95+sitH*1.2+standH*1.65+trainH*2.2+cardioH*4.0+stepsH*1.8+restH*1.4;
  return{pal:Math.round(sum/24*100)/100,sum:Math.round(sum*100)/100,
    sleepH:sleepH,sitH:sitH,standH:standH,trainH:trainH,cardioH:cardioH,stepsH:stepsH,restH:Math.round(restH*100)/100};
}

function calcDayTarget(ds){
  const p=getProfile();const bmr=calcBMR(p);if(!bmr)return null;
  const pal=calcPAL(ds);const tee=Math.round(bmr*pal.pal);
  const diff=p.weight-(p.targetWeight||p.weight);
  let deficit=0;
  if(diff>0)deficit=p.goal==='fat'?-300:p.goal==='recomp'?-150:0;
  else if(diff<0)deficit=200;
  const kcal=Math.round(tee+deficit);
  const protein=Math.round(p.weight*2.0);
  const fat=Math.round(p.weight*0.9);
  const carbs=Math.max(Math.round((kcal-protein*4-fat*9)/4),50);
  return{kcal:kcal,protein:protein,carbs:carbs,fat:fat,tdee:tee,bmr:Math.round(bmr),pal:pal.pal,deficit:deficit};
}

// ── STATE ─────────────────────────────────────────────────────────
var cV='Heute';
var addMode='ki';
var aiResult=null;
var scanning=false;
var viewDate=todayStr();
var isRecording=false;
var recognition=null;
var scanAmount='';
var scanUnit='ml';

// ── NAVIGATION ────────────────────────────────────────────────────
function setView(v){
  cV=v;
  ['Heute','Woche','Monat','Aktivitaet','Profil'].forEach(function(n){
    document.getElementById('v'+n).classList.toggle('show',n===v);
    document.getElementById('n'+n).classList.toggle('active',n===v);
  });
  if(v==='Heute')renderHeute();

}

// ── RING SVG ─────────────────────────────────────────────────────
function ring(val,target,color,size,sw){
  size=size||52;sw=sw||5;
  var r=(size-sw*2)/2;var circ=2*Math.PI*r;
  var pct=target>0?Math.min(val/target,1):0;
  var fc=(val>target&&target>0)?'var(--red)':color;
  var offset=circ*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--s3)" stroke-width="'+sw+'"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+fc+'" stroke-width="'+sw+'"'+
    ' stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" stroke-linecap="round"/>'+
    '</svg>';
}

// ── API CALL ──────────────────────────────────────────────────────
async function callAI(msgs){
  var key=getApiKey();if(!key)return null;
  var resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:800,messages:msgs})
  });
  if(!resp.ok){var e=await resp.json();throw new Error(e.error&&e.error.message?e.error.message:'API Fehler '+resp.status);}
  var data=await resp.json();
  return data.content.map(function(c){return c.text||'';}).join('');
}

async function analyzeText(){
  var inp=document.getElementById('aiInp');
  var text=inp?inp.value.trim():'';
  if(!text){alert('Bitte beschreibe was du gegessen hast.');return;}
  scanning=true;aiResult=null;renderHeute();
  try{
    var prompt='Analysiere diese Mahlzeitenbeschreibung und erkenne alle genannten Mahlzeiten automatisch.\n'+
      'Erkenne den Mahlzeitentyp aus dem Kontext: Frühstück=breakfast, Mittag=lunch, Abend/Abendessen=dinner, Snack=snack.\n'+
      'Beschreibung: "'+text+'"\n\n'+
      'Antworte NUR mit einem JSON-Array (keine Backticks, kein erklärender Text):\n'+
      '[{"name":"kurze Beschreibung","meal":"breakfast","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0,"calcium":0,"iron":0,"vitC":0,"vitD":0,"magnesium":0,"omega3":0}]\n'+
      'Falls nur eine Mahlzeit: Array mit einem Element. Schätze Mikronährstoffe realistisch.';
    var raw=await callAI([{role:'user',content:prompt}]);
    var parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    aiResult=Array.isArray(parsed)?parsed:[parsed];
  }catch(e){alert('Fehler: '+e.message);aiResult=null;}
  scanning=false;renderHeute();
}

async function handleScan(event){
  var file=event.target.files[0];if(!file)return;
  event.target.value='';
  scanning=true;aiResult=null;renderHeute();
  try{
    var b64=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(',')[1]);};r.onerror=rej;r.readAsDataURL(file);});
    var mime=file.type||'image/jpeg';
    var amountText='';
    if(scanAmount&&parseFloat(scanAmount)>0){
      if(scanUnit==='portion'){
        amountText='Der Nutzer isst/trinkt '+scanAmount+' Portion(en) davon. Falls das Etikett eine Portionsgröße angibt, rechne die Nährwerte für '+scanAmount+' Portion(en) hoch.';
      } else {
        amountText='WICHTIG: Der Nutzer isst/trinkt genau '+scanAmount+scanUnit+' davon. '+
          'Falls das Etikett Nährwerte pro 100'+scanUnit+' angibt (Standard bei deutschen Etiketten), '+
          'MUSST du diese Werte auf '+scanAmount+scanUnit+' hochrechnen (Faktor '+(parseFloat(scanAmount)/100)+'). '+
          'Gib NIEMALS die reinen 100'+scanUnit+'-Werte zurück, sondern immer die für die tatsächlich konsumierte Menge von '+scanAmount+scanUnit+'.';
      }
    } else {
      amountText='Keine Menge angegeben – falls es ein Etikett mit "pro 100ml/100g" ist, nutze die dort angegebene Gesamtpackungsgröße oder schätze eine übliche Portion. Falls es eine fertige Mahlzeit ist, schätze die sichtbare Portion.';
    }
    var prompt='Analysiere dieses Bild.\n'+
      'Falls Nährwertetikett: lies die Tabelle genau ab (meist "pro 100ml" oder "pro 100g" beschriftet).\n'+
      'Falls Mahlzeit/Speise: schätze Nährwerte der gesamten sichtbaren Portion.\n\n'+
      amountText+'\n\n'+
      'Der Name soll die tatsächliche Menge enthalten, z.B. "330ml Kaffee-Milchgetränk" nicht nur "Kaffee-Milchgetränk".\n\n'+
      'Antworte NUR mit JSON-Array (keine Backticks, kein Text):\n'+
      '[{"name":"kurze Beschreibung mit Menge","meal":"snack","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0,"calcium":0,"iron":0,"vitC":0,"vitD":0,"magnesium":0,"omega3":0}]';
    var msgs=[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:prompt}]}];
    var raw=await callAI(msgs);
    var parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    aiResult=Array.isArray(parsed)?parsed:[parsed];
  }catch(e){alert('Fehler: '+e.message);aiResult=null;}
  scanning=false;renderHeute();
}

function addAiEntry(){
  if(!aiResult||!aiResult.length)return;
  var ds=viewDate;var entries=getEntries(ds);var multi=aiResult.length>1;
  aiResult.forEach(function(r,i){
    var meal=multi?r.meal:(document.getElementById('mealTypeAi_'+i)?document.getElementById('mealTypeAi_'+i).value:r.meal||'snack');

function renderWoche(){
  var days=getWeekDays();
  var totals=days.map(function(d){return getDayTotals(dateStr(d));});
  var kcals=totals.map(function(t){return Math.round(t.kcal);});
  var maxKcal=Math.max.apply(null,kcals.concat([1]));
  var todayDs=todayStr();var t=calcDayTarget(todayDs);
  var h='';

  h+='<div class="lbl">Kalorien diese Woche</div><div class="card"><div class="week-bars">';
  days.forEach(function(d,i){
    var ds=dateStr(d);var kcal=kcals[i];var isT=ds===todayDs;
    var hPct=kcal>0?Math.max(Math.round(kcal/maxKcal*100),5):4;
    var barColor=isT?'var(--green)':'var(--amber)';
    h+='<div class="wbar-wrap">'+
      '<div style="font-size:9px;color:'+(isT?'var(--green)':'var(--text3)');h+=';font-weight:'+(isT?700:500)+'">'+( kcal>0?kcal:'')+'</div>'+
      '<div class="wbar" style="height:'+hPct+'%;background:'+(kcal>0?barColor:'var(--s3)')+'"></div>'+
      '<div style="font-size:9px;color:'+(isT?'var(--green)':'var(--text3)')+';font-weight:'+(isT?700:500)+'">'+dayName(d)+'</div>'+
      '</div>';
  });
  h+='</div>';
  if(t)h+='<div style="font-size:11px;color:var(--text3);text-align:center">Ziel: '+t.kcal+' kcal/Tag</div>';
  h+='</div>';

  var active=totals.filter(function(t){return t.kcal>0;});
  function avg(key){return active.length>0?Math.round(active.reduce(function(s,t){return s+(t[key]||0);},0)/active.length):0;}
  h+='<div class="lbl">Ø Woche ('+active.length+' Tage)</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'+
    mkStat(avg('kcal'),'kcal/Tag','var(--amber)')+
    mkStat(avg('protein')+'g','Protein','var(--green)')+
    mkStat(avg('carbs')+'g','Kohlenhydrate','var(--blue)')+
    mkStat(avg('fat')+'g','Fett','var(--purple)')+
    mkStat(avg('fiber')+'g','Ballaststoffe','var(--teal)')+
    mkStat(active.length+'/7','Tage','var(--text)')+'</div>';

  var weights=days.map(function(d){return{day:dayName(d),w:ld(WK(dateStr(d)),''),isT:dateStr(d)===todayDs};});
  if(weights.some(function(w){return w.w;})){
    h+='<div class="lbl">Gewichtsverlauf</div><div class="card">';
    weights.forEach(function(w){
      if(!w.w)return;
      h+='<div class="micro-row"><div class="micro-name" style="color:'+(w.isT?'var(--green)':'inherit')+'">'+w.day+'</div><div style="font-size:14px;font-weight:700;color:'+(w.isT?'var(--green)':'var(--text)')+'">'+w.w+' kg</div></div>';
    });
    h+='</div>';
  }

  var waists=days.map(function(d){return{day:dayName(d),w:ld(WAISTK(dateStr(d)),''),isT:dateStr(d)===todayDs};});
  if(waists.some(function(w){return w.w;})){
    h+='<div class="lbl">Bauchumfang-Verlauf</div><div class="card">';
    waists.forEach(function(w){
      if(!w.w)return;
      h+='<div class="micro-row"><div class="micro-name" style="color:'+(w.isT?'var(--green)':'inherit')+'">'+w.day+'</div><div style="font-size:14px;font-weight:700;color:'+(w.isT?'var(--green)':'var(--text)')+'">'+w.w+' cm</div></div>';
    });
    h+='</div>';
  }
  document.getElementById('vWoche').innerHTML=h;
}

function mkStat(num,lbl,color){
  return '<div class="card-sm" style="text-align:center">'+
    '<div style="font-size:20px;font-weight:800;letter-spacing:-.5px;color:'+color+'">'+num+'</div>'+
    '<div style="font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-top:2px">'+lbl+'</div></div>';
}

// ── RENDER MONAT ──────────────────────────────────────────────────
function renderMonat(){
  var now=new Date();var year=now.getFullYear();var month=now.getMonth();
  var firstDay=new Date(year,month,1);var lastDay=new Date(year,month+1,0);
  var t=calcDayTarget(todayStr());var todayDs=todayStr();
  var h='';

  h+='<div class="lbl">'+now.toLocaleDateString('de-DE',{month:'long',year:'numeric'})+'</div><div class="cal-grid">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(function(d){h+='<div class="cal-hd">'+d+'</div>';});
  var startDow=firstDay.getDay();if(startDow===0)startDow=7;
  for(var i=1;i<startDow;i++)h+='<div class="cal-d" style="background:transparent"></div>';

  var monthTotal=0;var monthDays=0;
  for(var day=1;day<=lastDay.getDate();day++){
    var ds=year+'-'+pad(month+1)+'-'+pad(day);
    var tots=getDayTotals(ds);var kcal=Math.round(tots.kcal);
    var isToday=ds===todayDs;var isFuture=ds>todayDs;
    if(kcal>0){monthTotal+=kcal;monthDays++;}
    var bg='var(--s2)';
    if(kcal>0&&t){var ratio=kcal/t.kcal;bg=ratio<0.8?'var(--blue)':ratio<=1.1?'var(--green)':'var(--amber)';}
    var opacity=isFuture?0.3:1;
    var cursor=ds<=todayDs?'pointer':'default';
    var outline=isToday?'border:2px solid var(--green);':'';
    var textColor=kcal>0?'#000':(isToday?'var(--green)':'var(--text3)');
    var onclick=ds<=todayDs?'onclick="goToDay(\''+ds+'\')"':'';
    h+='<div class="cal-d" '+onclick+' style="background:'+(kcal>0?bg:'var(--s2)')+';opacity:'+opacity+';cursor:'+cursor+';'+outline+'">'+
      '<span style="font-size:11px;font-weight:'+(isToday?800:600)+';color:'+textColor+'">'+day+'</span></div>';
  }
  h+='</div>';

  h+='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
    '<span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--green);display:inline-block"></span>Ziel ±10%</span>'+
    '<span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--amber);display:inline-block"></span>Über Ziel</span>'+
    '<span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--blue);display:inline-block"></span>Unter Ziel</span>'+
    '</div>';

  if(monthDays>0){
    h+='<div class="lbl">Monatsstatistik</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'+
      mkStat(Math.round(monthTotal/monthDays),'kcal Ø/Tag','var(--amber)')+
      mkStat(monthDays,'Tage getrackt','var(--green)')+
      mkStat(Math.round(monthTotal/1000*10)/10+'k','kcal gesamt','var(--text)')+'</div>';
  }
  document.getElementById('vMonat').innerHTML=h;
}

// ── AKTIVITÄT KI ──────────────────────────────────────────────────
async function analyzeActivity(){
  var inp=document.getElementById('actAiInp');
  var text=inp?inp.value.trim():'';
  if(!text){alert('Bitte beschreibe deine heutige Aktivität.');return;}
  scanning=true;renderAkt();
  try{
    var prompt='Extrahiere Aktivitätsdaten aus diesem Text: "'+text+'"\n\n'+
      'Antworte NUR mit diesem JSON-Objekt (keine Backticks, kein Text):\n'+
      '{"sleep":7,"sitting":8,"standing":0,"training":0,"cardio":0,"steps":0}\n\n'+
      'sleep = Schlafstunden (Dezimal ok, z.B. 7.5)\n'+
      'sitting = Stunden sitzend/Büro/Auto/Couch (Dezimal ok)\n'+
      'standing = Stunden stehend oder gehend bei der Arbeit, z.B. Meetings im Stehen, Praxisbesuche, Standing Desk (Dezimal ok)\n'+
      'training = Minuten Krafttraining/Gewichte (nur Ganzzahl)\n'+
      'cardio = Minuten Zone 2/Ausdauer/Rudern/Radfahren/Laufen/Schwimmen (nur Ganzzahl, NICHT Krafttraining)\n'+
      'steps = Schritte (Ganzzahl)\n'+
      'Falls ein Wert nicht genannt: Standardwert verwenden (sleep:7, sitting:8, standing:0, training:0, cardio:0, steps:0)';
    var raw=await callAI([{role:'user',content:prompt}]);
    var result=JSON.parse(raw.replace(/```json|```/g,'').trim());
    saveActivity(viewDate,{
      sleep:parseFloat(result.sleep)||7,
      sitting:parseFloat(result.sitting)||8,
      standing:parseFloat(result.standing)||0,
      training:parseFloat(result.training)||0,
      cardio:parseFloat(result.cardio)||0,
      steps:parseFloat(result.steps)||0,
    });
  }catch(e){alert('Fehler: '+e.message);}
  scanning=false;renderAkt();
}

// ── SPEECH RECOGNITION ────────────────────────────────────────────
function toggleRecording(){
  if(isRecording){stopRecording();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Spracherkennung nicht verfügbar – bitte Text eingeben.');return;}
  recognition=new SR();
  recognition.lang='de-DE';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onresult=function(event){
    var transcript=event.results[0][0].transcript;
    var inp=document.getElementById('actAiInp');
    if(inp)inp.value=transcript;
    stopRecording();
    analyzeActivity();
  };
  recognition.onerror=function(e){alert('Mikrofon-Fehler: '+e.error);stopRecording();};
  recognition.onend=function(){if(isRecording)stopRecording();};
  recognition.start();
  isRecording=true;renderAkt();
}
function stopRecording(){
  if(recognition)try{recognition.stop();}catch(e){}
  isRecording=false;renderAkt();
}

    '<div class="pf-field"><div class="pf-label">Größe (cm)</div><input class="pf-input" type="number" id="pH" value="'+(p.height||'')+'" placeholder="180" oninput="pChanged()"/></div>'+
    '<div class="pf-field"><div class="pf-label">Gewicht (kg)</div><input class="pf-input" type="number" id="pW" value="'+(p.weight||'')+'" placeholder="84" step="0.1" oninput="pChanged()"/></div>'+
    '<div class="pf-field"><div class="pf-label">Zielgewicht (kg)</div><input class="pf-input" type="number" id="pT" value="'+(p.targetWeight||'')+'" placeholder="72" step="0.1" oninput="pChanged()"/></div>'+
    '<div class="pf-field"><div class="pf-label">Aktivitätslevel (Standard)</div>'+
    '<button class="abtn'+(p.activity===1.2?' on':'')+'" onclick="setA(1.2)"><span>Sitzend</span><span class="as">Büro, kein Sport</span></button>'+
    '<button class="abtn'+(p.activity===1.4?' on':'')+'" onclick="setA(1.4)"><span>Leicht aktiv</span><span class="as">1–3× Sport/Woche</span></button>'+
    '<button class="abtn'+(p.activity===1.6?' on':'')+'" onclick="setA(1.6)"><span>Mäßig aktiv</span><span class="as">3–5× Sport/Woche</span></button>'+
    '<button class="abtn'+(p.activity===1.8?' on':'')+'" onclick="setA(1.8)"><span>Sehr aktiv</span><span class="as">6–7× Sport/Woche</span></button></div>'+
    '<div class="pf-field"><div class="pf-label">Ziel</div>'+
    '<button class="abtn'+(p.goal==='fat'?' on':'')+'" onclick="setGoal(\'fat\')"><span>Fettabbau</span><span class="as">−300 kcal Defizit</span></button>'+
    '<button class="abtn'+(p.goal==='recomp'?' on':'')+'" onclick="setGoal(\'recomp\')"><span>Rekomposition</span><span class="as">−150 kcal</span></button>'+
    '<button class="abtn'+(p.goal==='muscle'?' on':'')+'" onclick="setGoal(\'muscle\')"><span>Muskelaufbau</span><span class="as">+200 kcal</span></button></div>'+
    '<button class="save-btn" onclick="saveP()">Speichern</button></div>';

  h+='<div class="lbl" style="margin-top:16px">KI-Analyse</div>';
  if(key){
    h+='<div style="background:var(--gbg);border:1px solid rgba(27,240,126,0.2);border-radius:var(--rsm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'+
      '<span style="font-size:13px;font-weight:600;color:var(--green)">✓ API Key gespeichert</span>'+
      '<button onclick="saveApiKey(\'\');renderProfil()" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer">Ändern</button></div>';
  }else{
    h+='<div class="api-box">'+
      '<div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px">🔑 Anthropic API Key</div>'+
      '<div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6">Einmalig eintragen für KI-Analyse und Spracheingabe. Bleibt lokal auf deinem Gerät.</div>'+
      '<input class="api-inp" type="password" id="apiKeyInp" placeholder="sk-ant-api03-..."/>'+
      '<button class="api-save" onclick="saveKey()">Key speichern</button></div>';
  }
  document.getElementById('vProfil').innerHTML=h;
}

function setG(g){var p=getProfile();p.gender=g;saveProfile(p);renderProfil();}
function setA(a){var p=getProfile();p.activity=a;saveProfile(p);renderProfil();}
function setGoal(g){var p=getProfile();p.goal=g;saveProfile(p);renderProfil();}
function pChanged(){
  var p=getProfile();
  p.age=parseInt(document.getElementById('pAge')?document.getElementById('pAge').value:p.age)||p.age;
  p.height=parseInt(document.getElementById('pH')?document.getElementById('pH').value:p.height)||p.height;
  p.weight=parseFloat(document.getElementById('pW')?document.getElementById('pW').value:p.weight)||p.weight;
  p.targetWeight=parseFloat(document.getElementById('pT')?document.getElementById('pT').value:p.targetWeight)||p.targetWeight;
  saveProfile(p);
}
function saveP(){pChanged();renderProfil();}
function saveKey(){
  var k=document.getElementById('apiKeyInp')?document.getElementById('apiKeyInp').value.trim():'';
  if(!k.startsWith('sk-ant')){alert('Kein gültiger Anthropic API Key.');return;}
  saveApiKey(k);renderProfil();
}

// ── INIT ──────────────────────────────────────────────────────────
document.getElementById('datePill').textContent=new Date().toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
viewDate=todayStr();
renderHeute();
</script>
