<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Ernährung"/>
<meta name="theme-color" content="#0A0A08"/>
<title>Ernährungs-Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A08;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;color:#F0EDE8}
:root{
  --bg:#0A0A08;--s1:#131311;--s2:#1A1A17;--s3:#222220;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F0EDE8;--text2:#8A8880;--text3:#4A4845;
  --green:#1BF07E;--gdim:#0DB859;--gbg:rgba(27,240,126,0.09);
  --amber:#F0A030;--abg:rgba(240,160,48,0.09);
  --blue:#4A9EF0;--bbg:rgba(74,158,240,0.09);
  --purple:#9B8FFF;--pbg:rgba(155,143,255,0.09);
  --red:#FF5A5A;--rbg:rgba(255,90,90,0.09);
  --teal:#00C4B4;--tbg:rgba(0,196,180,0.09);
  --radius:16px;--rsm:12px;--rxs:8px;
}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,20px) 20px 0;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}
.app-name{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.date-pill{font-size:12px;font-weight:600;color:var(--text2);background:var(--s2);padding:5px 12px;border-radius:20px;border:1px solid var(--border2)}
.scroll{flex:1;overflow-y:auto;padding:20px 20px 100px}
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--s1);border-top:1px solid var(--border);display:flex;padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:100}
.navi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;padding:2px 4px}
.navi .ni{font-size:20px;color:var(--text3)}.navi .nl{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.04em}
.navi.active .ni,.navi.active .nl{color:var(--green)}
.view{display:none}.view.show{display:block}
/* MACRO RINGS */
.macro-ring-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.ring-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px}
.ring-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.ring-info{flex:1;min-width:0}
.ring-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.ring-val{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1}
.ring-target{font-size:11px;color:var(--text3);margin-top:2px}
/* CALORIE HERO */
.kcal-hero{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.kcal-ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.kcal-ring-wrap svg{transform:rotate(-90deg)}
.kcal-num-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.kcal-num{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-1px;line-height:1}
.kcal-unit{font-size:9px;color:var(--text3);font-weight:600}
.kcal-details{flex:1}
.kcal-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.kcal-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.kcal-row .kl{color:var(--text2)}.kcal-row .kv{font-weight:600;color:var(--text)}
/* MEAL LIST */
.meal-section{margin-bottom:14px}
.meal-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.meal-section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.meal-section-kcal{font-size:11px;font-weight:600;color:var(--amber)}
.meal-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden;margin-bottom:6px}
.meal-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.meal-macros{font-size:11px;color:var(--text3)}
.meal-kcal{font-size:15px;font-weight:700;color:var(--amber)}
/* ADD MEAL */
.add-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.add-tabs{display:flex;gap:5px;margin-bottom:12px}
.add-tab{flex:1;padding:8px;border-radius:var(--rxs);border:1px solid var(--border2);background:transparent;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s}
.add-tab.on{background:var(--green);border-color:var(--green);color:#000}
.ai-input-row{display:flex;gap:8px;align-items:flex-end}
.ai-textarea{flex:1;min-height:44px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:14px;padding:10px 12px;resize:none;font-family:-apple-system,sans-serif;line-height:1.4}
.ai-send{width:44px;height:44px;border-radius:var(--rxs);background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#000}
.ai-send.loading{background:var(--s3);cursor:default;color:var(--text3)}
.ai-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
.ai-result{background:var(--s2);border:1px solid rgba(27,240,126,0.2);border-radius:var(--rsm);padding:12px;margin-top:10px}
.ai-result-name{font-size:12px;font-weight:600;color:var(--green);margin-bottom:8px;font-style:italic}
.ai-macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ai-macro{background:var(--bg);border-radius:var(--rxs);padding:6px 8px;text-align:center}
.ai-macro-v{font-size:16px;font-weight:700;letter-spacing:-.5px}
.ai-macro-l{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-top:1px}
.micro-grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.micro-pill{font-size:10px;background:var(--s3);color:var(--text2);padding:3px 8px;border-radius:6px}
.add-meal-btn{width:100%;padding:11px;border-radius:var(--rxs);background:var(--green);border:none;color:#000;font-size:13px;font-weight:700;cursor:pointer}
/* MANUAL FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.form-input{height:38px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:14px;font-weight:600;padding:0 10px;text-align:center}
.form-input.full{grid-column:1/-1;text-align:left}
/* MIKRO */
.micro-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.micro-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.micro-row:last-child{border-bottom:none}
.micro-name{font-size:13px;color:var(--text2)}
.micro-bar-wrap{flex:1;margin:0 10px;height:4px;background:var(--s3);border-radius:2px}
.micro-bar-fill{height:4px;border-radius:2px;transition:width .3s}
.micro-vals{font-size:12px;font-weight:600;color:var(--text);text-align:right;min-width:70px}
/* WEEKLY */
.week-chart{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.week-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:8px}
.week-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-bar{width:100%;border-radius:5px 5px 0 0;min-height:3px;background:var(--s3);transition:height .4s}
.week-bar.has{background:var(--amber)}
.week-bar.today{background:var(--green)}
.week-day-lbl{font-size:9px;color:var(--text3);font-weight:600}
.week-kcal-lbl{font-size:9px;color:var(--text3)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
/* MONTHLY */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-head{font-size:9px;font-weight:700;color:var(--text3);text-align:center;letter-spacing:.05em;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:var(--rxs);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:default;position:relative}
.cal-day.empty{background:transparent;color:var(--text3)}
.cal-day.has{color:#000}
.cal-day.today-dot{border:2px solid var(--green)}
/* PROFIL */
.profile-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.profile-field{margin-bottom:14px}
.profile-field:last-child{margin-bottom:0}
.field-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.field-input{width:100%;height:44px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--s2);color:var(--text);font-size:17px;font-weight:600;padding:0 14px}
.gender-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender-btn{padding:12px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.gender-btn.on{background:var(--green);border-color:var(--green);color:#000}
.activity-row{display:flex;flex-direction:column;gap:6px}
.act-btn{padding:10px 14px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.act-btn .as{font-size:11px;font-weight:400;color:var(--text3)}
.act-btn.on{border-color:var(--green);color:var(--text)}
.act-btn.on .as{color:var(--green)}
.save-btn{width:100%;padding:15px;border-radius:var(--rsm);background:var(--green);border:none;color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.bmi-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bmi-val{font-size:42px;font-weight:800;letter-spacing:-2px;margin-bottom:4px}
.bmi-cat{font-size:13px;font-weight:600;margin-bottom:12px}
.bmi-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.bmi-row:last-child{border-bottom:none}
.bmi-l{color:var(--text2)}.bmi-r{font-weight:600;color:var(--text)}
.api-box{background:var(--s1);border:1px solid rgba(240,160,48,0.3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.api-title{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px}
.api-text{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6}
.api-inp{width:100%;height:40px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s2);color:var(--text);font-size:13px;padding:0 12px;font-family:monospace;margin-bottom:8px}
.api-save{width:100%;padding:10px;border-radius:var(--rxs);background:var(--amber);border:none;color:#000;font-size:13px;font-weight:700;cursor:pointer}
.scan-btn{width:100%;padding:13px;border-radius:var(--rsm);border:1px solid var(--border2);background:var(--s2);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.scan-btn.green{background:var(--green);border-color:var(--green);color:#000}
.meal-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px;margin-left:8px}
.weight-input-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px}
.wi-label{font-size:12px;color:var(--text2);flex:1}
.wi-inp{width:70px;height:34px;border:1px solid var(--border2);border-radius:var(--rxs);background:var(--s3);color:var(--text);font-size:15px;font-weight:700;padding:0 8px;text-align:center}
.wi-btn{padding:6px 14px;border-radius:var(--rxs);background:var(--green);border:none;color:#000;font-size:12px;font-weight:700;cursor:pointer}
.lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:0 0 10px}
#fileInput{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-name">Ernährungs-Tracker</div>
      <div class="date-pill" id="datePill"></div>
    </div>
  </div>
  <div class="scroll">
    <div id="vHeute" class="view show"></div>
    <div id="vWoche" class="view"></div>
    <div id="vMonat" class="view"></div>
    <div id="vProfil" class="view"></div>
  </div>
  <nav class="nav-bar">
    <button class="navi active" id="nHeute" onclick="setView('Heute')"><div class="ni">🏠</div><div class="nl">Heute</div></button>
    <button class="navi" id="nWoche" onclick="setView('Woche')"><div class="ni">📊</div><div class="nl">Woche</div></button>
    <button class="navi" id="nMonat" onclick="setView('Monat')"><div class="nl" style="font-size:16px;margin-bottom:2px">📅</div><div class="nl">Monat</div></button>
    <button class="navi" id="nProfil" onclick="setView('Profil')"><div class="ni">👤</div><div class="nl">Profil</div></button>
  </nav>
  <input type="file" id="fileInput" accept="image/*" onchange="handleScan(event)"/>
</div>
<script>
// ── STORAGE ──────────────────────────────────────────────────────
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch(e){return d;}};

// ── DATE HELPERS ─────────────────────────────────────────────────
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getWeekDays(){const days=[];const today=new Date();today.setHours(0,0,0,0);const dow=today.getDay();const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}return days;}
function getDayName(d){return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];}

// ── DATA ─────────────────────────────────────────────────────────
const entriesKey=(ds)=>`nutr_entries_${ds}`;
const weightKey=(ds)=>`nutr_weight_${ds}`;
function getEntries(ds){return ld(entriesKey(ds),[]);}
function saveEntries(ds,arr){sv(entriesKey(ds),arr);}
function getDayTotals(ds){
  const entries=getEntries(ds);
  const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0,sodium:0,calcium:0,iron:0,vitC:0,vitD:0,magnesium:0,omega3:0};
  entries.forEach(e=>{Object.keys(t).forEach(k=>{t[k]+=(e[k]||0);});});
  return t;
}
function getProfile(){return ld('nutr_profile',{gender:'M',age:30,height:180,weight:80,targetWeight:75,activity:1.4,goal:'fat'});}
function saveProfile(p){sv('nutr_profile',p);}
function getApiKey(){return ld('nutr_apikey','');}
function saveApiKey(k){sv('nutr_apikey',k);}

// ── CALCULATIONS ─────────────────────────────────────────────────
function calcBMI(weight,height){return Math.round((weight/(height/100)**2)*10)/10;}
function calcBMICategory(bmi){if(bmi<18.5)return{cat:'Untergewicht',color:'var(--blue)'};if(bmi<25)return{cat:'Normalgewicht',color:'var(--green)'};if(bmi<30)return{cat:'Übergewicht',color:'var(--amber)'};return{cat:'Adipositas',color:'var(--red)'};}
function calcTargets(){
  const p=getProfile();
  if(!p.weight||!p.height||!p.age)return null;
  const bmr=p.gender==='M'?10*p.weight+6.25*p.height-5*p.age+5:10*p.weight+6.25*p.height-5*p.age-161;
  const tdee=Math.round(bmr*p.activity);
  const diff=p.weight-p.targetWeight;
  let deficit=0;
  if(diff>0)deficit=p.goal==='fat'?-300:p.goal==='recomp'?-150:0;
  else if(diff<0)deficit=200;
  const kcal=Math.round(tdee+deficit);
  const protein=Math.round(p.weight*2.0);
  const fat=Math.round(p.weight*0.9);
  const carbs=Math.max(Math.round((kcal-protein*4-fat*9)/4),50);
  return{kcal,protein,carbs,fat,tdee,bmr:Math.round(bmr)};
}

// ── STATE ─────────────────────────────────────────────────────────
let cV='Heute';let addMode='ki';let aiResult=null;let scanning=false;
let editEntry=null;

// ── NAVIGATION ────────────────────────────────────────────────────
function setView(v){
  cV=v;
  ['Heute','Woche','Monat','Profil'].forEach(n=>{
    document.getElementById('v'+n).classList.toggle('show',n===v);
    document.getElementById('n'+n).classList.toggle('active',n===v);
  });
  if(v==='Heute')renderHeute();
  if(v==='Woche')renderWoche();
  if(v==='Monat')renderMonat();
  if(v==='Profil')renderProfil();
}

// ── RING SVG ─────────────────────────────────────────────────────
function ring(val,target,color,size=52,sw=5){
  const r=(size-sw*2)/2;const circ=2*Math.PI*r;
  const pct=target>0?Math.min(val/target,1):0;
  const over=val>target;
  const fc=over?'var(--red)':color;
  const offset=circ*(1-pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s3)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${fc}" stroke-width="${sw}"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}

// ── RENDER HEUTE ──────────────────────────────────────────────────
function renderHeute(){
  const ds=todayStr();const t=calcTargets();const tots=getDayTotals(ds);
  const entries=getEntries(ds);const key=getApiKey();
  let h='';

  // Kalorie Hero Ring
  const kcalPct=t?Math.min(tots.kcal/t.kcal,1):0;
  const kcalOver=t&&tots.kcal>t.kcal;
  h+=`<div class="kcal-hero">
    <div class="kcal-ring-wrap">
      ${ring(tots.kcal,t?t.kcal:2000,'var(--amber)',80,7)}
      <div class="kcal-num-inner"><div class="kcal-num" style="color:${kcalOver?'var(--red)':'var(--amber)'}">${Math.round(tots.kcal)}</div><div class="kcal-unit">kcal</div></div>
    </div>
    <div class="kcal-details">
      <div class="kcal-title">Heute ${new Date().toLocaleDateString('de-DE',{weekday:'long'})}</div>
      <div class="kcal-row"><span class="kl">Ziel</span><span class="kv">${t?t.kcal:'-'} kcal</span></div>
      <div class="kcal-row"><span class="kl">Rest</span><span class="kv" style="color:${kcalOver?'var(--red)':'var(--green)'}">${t?Math.max(0,t.kcal-Math.round(tots.kcal)):'-'} kcal</span></div>
      ${t?`<div class="kcal-row"><span class="kl">TDEE</span><span class="kv">${t.tdee} kcal</span></div>`:''}
    </div>
  </div>`;

  // Makro Ringe
  const macros=[
    {key:'protein',label:'Protein',color:'var(--green)',unit:'g',target:t?t.protein:0},
    {key:'carbs',label:'Kohlenhydrate',color:'var(--blue)',unit:'g',target:t?t.carbs:0},

  // Mikronährstoffe
  const micros=[
    {key:'sugar',label:'Zucker',target:50,unit:'g',color:'var(--amber)'},
    {key:'sodium',label:'Natrium',target:2300,unit:'mg',color:'var(--red)'},
    {key:'calcium',label:'Kalzium',target:1000,unit:'mg',color:'var(--blue)'},
    {key:'iron',label:'Eisen',target:14,unit:'mg',color:'var(--purple)'},

  if(anyMicro){
    h+=`<div class="lbl" style="margin-top:20px">Mikronährstoffe</div><div class="micro-section">`;
    micros.forEach(m=>{

  }

  document.getElementById('vHeute').innerHTML=h;

// ── AI ANALYZE ─────────────────────────────────────────────────────
async function callAI(prompt,imageData,imageMime){
  const key=getApiKey();if(!key)return null;
  const content=imageData?[
    {type:'image',source:{type:'base64',media_type:imageMime,data:imageData}},
    {type:'text',text:prompt}
  ]:[{type:'text',text:prompt}];
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,messages:[{role:'user',content}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'API Fehler');}
  const data=await resp.json();
  return data.content.map(c=>c.text||'').join('');
}

const AI_PROMPT=(prefix)=>`${prefix}
Antworte NUR mit diesem JSON (keine Backticks, kein Text):
{"name":"kurze Beschreibung","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0,"calcium":0,"iron":0,"vitC":0,"vitD":0,"magnesium":0,"omega3":0}
Alle Werte als Gesamtwerte der beschriebenen Mahlzeit. Schätze Mikronährstoffe realistisch.`;

async function analyzeText(){
  const inp=document.getElementById('aiInput');
  const text=inp?.value.trim();
  if(!text){alert('Bitte beschreibe was du gegessen hast.');return;}
  scanning=true;aiResult=null;renderHeute();
  try{
    const raw=await callAI(AI_PROMPT(`Schätze die Nährwerte dieser Mahlzeit: "${text}"`),null,null);
    aiResult=JSON.parse(raw.replace(/```json|```/g,'').trim());
  }catch(e){alert('Fehler: '+e.message);aiResult=null;}
  scanning=false;renderHeute();
}

async function handleScan(event){
  const file=event.target.files[0];if(!file)return;
  event.target.value='';
  scanning=true;aiResult=null;renderHeute();
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const mime=file.type||'image/jpeg';
    const prompt=AI_PROMPT('Analysiere dieses Bild. Falls es ein Nährwertetikett ist: lies die Werte pro Portion aus. Falls es eine Mahlzeit ist: schätze die Nährwerte der gesamten sichtbaren Portion.');
    const raw=await callAI(prompt,b64,mime);
    aiResult=JSON.parse(raw.replace(/```json|```/g,'').trim());
  }catch(e){alert('Fehler: '+e.message);aiResult=null;}
  scanning=false;renderHeute();
}

function addAiEntry(){
  if(!aiResult)return;
  const ds=todayStr();
  const meal=document.getElementById('mealTypeAi')?.value||'snack';
  const entries=getEntries(ds);
  entries.push({...aiResult,meal,id:Date.now()});
  saveEntries(ds,entries);
  aiResult=null;renderHeute();
}

function addManual(){
  const name=document.getElementById('mName')?.value.trim()||'Mahlzeit';
  const kcal=parseFloat(document.getElementById('mKcal')?.value)||0;
  const protein=parseFloat(document.getElementById('mProtein')?.value)||0;
  const carbs=parseFloat(document.getElementById('mCarbs')?.value)||0;
  const fat=parseFloat(document.getElementById('mFat')?.value)||0;
  const meal=document.getElementById('mealType')?.value||'snack';
  const ds=todayStr();
  const entries=getEntries(ds);
  entries.push({name,kcal,protein,carbs,fat,fiber:0,sugar:0,sodium:0,calcium:0,iron:0,vitC:0,vitD:0,magnesium:0,omega3:0,meal,id:Date.now()});
  saveEntries(ds,entries);
  renderHeute();
}

function delEntry(ds,id){
  const entries=getEntries(ds).filter(e=>e.id!==id);
  saveEntries(ds,entries);renderHeute();
}

function logWeight(){
  const val=document.getElementById('weightInput')?.value;
  if(!val)return;
  sv(weightKey(todayStr()),parseFloat(val));
  renderHeute();
}

function setAddMode(m){addMode=m;aiResult=null;renderHeute();}

// ── RENDER WOCHE ──────────────────────────────────────────────────
function renderWoche(){
  const days=getWeekDays();const t=calcTargets();
  const totals=days.map(d=>getDayTotals(dateStr(d)));
  const kcals=totals.map(t=>Math.round(t.kcal));
  const maxKcal=Math.max(...kcals,1);
  const todayDs=todayStr();
  let h='';
  h+=`<div class="lbl">Kalorien diese Woche</div><div class="week-chart">
    <div class="week-bars">`;
  days.forEach((d,i)=>{
    const ds=dateStr(d);const kcal=kcals[i];const isToday=ds===todayDs;
    const hPct=kcal>0?Math.max(Math.round(kcal/maxKcal*100),5):5;
    h+=`<div class="week-bar-wrap">
      <div style="font-size:9px;color:${isToday?'var(--green)':'var(--text3)'};font-weight:${isToday?700:500}">${kcal>0?kcal:''}</div>
      <div class="week-bar ${kcal>0?(isToday?'today':'has'):''}" style="height:${hPct}%"></div>
      <div class="week-day-lbl" style="color:${isToday?'var(--green)':'var(--text3)'}">${getDayName(d)}</div>
    </div>`;
  });
  h+=`</div>`;
  if(t)h+=`<div style="font-size:11px;color:var(--text3);text-align:center">Ziel: ${t.kcal} kcal/Tag</div>`;
  h+=`</div>`;

  // Wochenschnitt Stats
  const activeDays=totals.filter(t=>t.kcal>0);
  const avg=(arr,key)=>activeDays.length>0?Math.round(activeDays.reduce((s,t)=>s+(t[key]||0),0)/activeDays.length):0;
  h+=`<div class="lbl">Durchschnitt (${activeDays.length} aktive Tage)</div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num" style="color:var(--amber)">${avg(totals,'kcal')}</div><div class="stat-lbl">kcal/Tag</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--green)">${avg(totals,'protein')}</div><div class="stat-lbl">Protein g</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--blue)">${avg(totals,'carbs')}</div><div class="stat-lbl">Kohlenhydrate g</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--purple)">${avg(totals,'fat')}</div><div class="stat-lbl">Fett g</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--teal)">${avg(totals,'fiber')}</div><div class="stat-lbl">Ballaststoffe g</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--text)">${activeDays.length}/7</div><div class="stat-lbl">Tage getrackt</div></div>
  </div>`;

  // Gewichtsverlauf
  const weights=days.map(d=>({day:getDayName(d),w:ld(weightKey(dateStr(d)),''),today:dateStr(d)===todayDs}));
  const anyWeight=weights.some(w=>w.w);
  if(anyWeight){
    h+=`<div class="lbl" style="margin-top:20px">Gewichtsverlauf</div>
    <div class="micro-section">`;
    weights.forEach(w=>{
      if(!w.w)return;
      h+=`<div class="micro-row"><div class="micro-name" style="color:${w.today?'var(--green)':'inherit'}">${w.day}</div><div class="bmi-r" style="color:${w.today?'var(--green)':'inherit'};font-size:14px;font-weight:700">${w.w} kg</div></div>`;
    });
    h+=`</div>`;
  }

  document.getElementById('vWoche').innerHTML=h;
}

// ── RENDER MONAT ──────────────────────────────────────────────────
function renderMonat(){
  const now=new Date();const year=now.getFullYear();const month=now.getMonth();
  const firstDay=new Date(year,month,1);const lastDay=new Date(year,month+1,0);
  const t=calcTargets();const todayDs=todayStr();
  let h='';
  h+=`<div class="lbl">${now.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</div>
  <div class="cal-grid">`;
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{h+=`<div class="cal-head">${d}</div>`;});
  // Empty days before first
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;
  for(let i=1;i<startDow;i++)h+=`<div class="cal-day empty"></div>`;
  // Days
  let monthTotal=0;let monthDays=0;
  for(let day=1;day<=lastDay.getDate();day++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const tots=getDayTotals(ds);const kcal=Math.round(tots.kcal);
    const isToday=ds===todayDs;const isFuture=ds>todayDs;
    if(kcal>0){monthTotal+=kcal;monthDays++;}
    let bg='var(--s2)';let opacity=1;
    if(kcal>0&&t){
      const ratio=kcal/t.kcal;
      if(ratio<0.8)bg='var(--blue)';
      else if(ratio<=1.1)bg='var(--green)';
      else bg='var(--amber)';
    } else if(isFuture){bg='var(--s2)';opacity=0.3;}
    h+=`<div class="cal-day ${kcal>0?'has':''} ${isToday?'today-dot':''}" style="background:${kcal>0?bg:'var(--s2)'};opacity:${opacity}" title="${kcal>0?kcal+' kcal':''}">
      <span style="font-size:11px;font-weight:${isToday?800:600};color:${kcal>0?'#000':(isToday?'var(--green)':'var(--text3)')}">${day}</span>
    </div>`;
  }
  h+=`</div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--green);display:inline-block"></span>Ziel erreicht</span>
    <span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--amber);display:inline-block"></span>Über Ziel</span>
    <span style="font-size:11px;display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--blue);display:inline-block"></span>Unter Ziel</span>
  </div>`;

  if(monthDays>0){
    h+=`<div class="lbl">Monatsstatistik</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" style="color:var(--amber)">${Math.round(monthTotal/monthDays)}</div><div class="stat-lbl">kcal Ø/Tag</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--green)">${monthDays}</div><div class="stat-lbl">Tage getrackt</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--text)">${Math.round(monthTotal/1000*10)/10}k</div><div class="stat-lbl">kcal gesamt</div></div>
    </div>`;
  }

  document.getElementById('vMonat').innerHTML=h;
}

      <div class="gender-row"><button class="gender-btn${p.gender==='M'?' on':''}" onclick="setGender('M')">Männlich</button><button class="gender-btn${p.gender==='F'?' on':''}" onclick="setGender('F')">Weiblich</button></div>
    </div>
    <div class="profile-field"><div class="field-label">Alter</div><input class="field-input" type="number" id="pAge" value="${p.age||''}" placeholder="39" oninput="profChanged()"/></div>
    <div class="profile-field"><div class="field-label">Größe (cm)</div><input class="field-input" type="number" id="pHeight" value="${p.height||''}" placeholder="180" oninput="profChanged()"/></div>
    <div class="profile-field"><div class="field-label">Aktuelles Gewicht (kg)</div><input class="field-input" type="number" id="pWeight" value="${p.weight||''}" placeholder="84" step="0.1" oninput="profChanged()"/></div>
    <div class="profile-field"><div class="field-label">Zielgewicht (kg)</div><input class="field-input" type="number" id="pTarget" value="${p.targetWeight||''}" placeholder="72" step="0.1" oninput="profChanged()"/></div>
    <div class="profile-field"><div class="field-label">Aktivitätslevel</div>
      <div class="activity-row">
        <button class="act-btn${p.activity===1.2?' on':''}" onclick="setActivity(1.2)"><span>Sitzend</span><span class="as">Büro, kein Sport</span></button>
        <button class="act-btn${p.activity===1.4?' on':''}" onclick="setActivity(1.4)"><span>Leicht aktiv</span><span class="as">1–3× Sport/Woche</span></button>
        <button class="act-btn${p.activity===1.6?' on':''}" onclick="setActivity(1.6)"><span>Mäßig aktiv</span><span class="as">3–5× Sport/Woche</span></button>
        <button class="act-btn${p.activity===1.8?' on':''}" onclick="setActivity(1.8)"><span>Sehr aktiv</span><span class="as">6–7× Sport/Woche</span></button>
      </div>
    </div>
    <div class="profile-field"><div class="field-label">Ziel</div>
      <div class="activity-row">
        <button class="act-btn${p.goal==='fat'?' on':''}" onclick="setGoal('fat')"><span>Fettabbau</span><span class="as">−300 kcal Defizit</span></button>
        <button class="act-btn${p.goal==='recomp'?' on':''}" onclick="setGoal('recomp')"><span>Rekomposition</span><span class="as">−150 kcal leichtes Defizit</span></button>
        <button class="act-btn${p.goal==='muscle'?' on':''}" onclick="setGoal('muscle')"><span>Muskelaufbau</span><span class="as">+200 kcal Überschuss</span></button>
      </div>
    </div>
    <button class="save-btn" onclick="saveProfileNow()">Speichern</button>
  </div>`;

  // API Key
  h+=`<div class="lbl" style="margin-top:20px">KI-Analyse</div>`;
  if(key){
    h+=`<div style="background:var(--gbg);border:1px solid rgba(27,240,126,0.2);border-radius:var(--rsm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600;color:var(--green)">✓ API Key gespeichert</span><button onclick="saveApiKey('');renderProfil()" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer">Ändern</button></div>`;
  } else {
    h+=`<div class="api-box"><div class="api-title">🔑 Anthropic API Key</div>
      <div class="api-text">Einmalig eintragen für KI-Analyse und Foto-Erkennung. Key bleibt lokal auf deinem Gerät.</div>
      <input class="api-inp" type="password" id="apiKeyInput" placeholder="sk-ant-api03-..."/>
      <button class="api-save" onclick="saveApiKeyNow()">Key speichern</button>
    </div>`;
  }

  document.getElementById('vProfil').innerHTML=h;
}

// Profil actions
function setGender(g){const p=getProfile();p.gender=g;saveProfile(p);renderProfil();}
function setActivity(a){const p=getProfile();p.activity=a;saveProfile(p);renderProfil();}
function setGoal(g){const p=getProfile();p.goal=g;saveProfile(p);renderProfil();}
function profChanged(){
  const p=getProfile();
  p.age=parseInt(document.getElementById('pAge')?.value)||0;
  p.height=parseInt(document.getElementById('pHeight')?.value)||0;
  p.weight=parseFloat(document.getElementById('pWeight')?.value)||0;
  p.targetWeight=parseFloat(document.getElementById('pTarget')?.value)||0;
  saveProfile(p);
}
function saveProfileNow(){profChanged();renderProfil();if(cV==='Heute')renderHeute();}
function saveApiKeyNow(){
  const k=document.getElementById('apiKeyInput')?.value.trim();
  if(!k?.startsWith('sk-ant')){alert('Kein gültiger Anthropic API Key.');return;}
  saveApiKey(k);renderProfil();
}

// ── INIT ─────────────────────────────────────────────────────────
document.getElementById('datePill').textContent=new Date().toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
renderHeute();
</script>
</body>
</html>
